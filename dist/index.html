<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#161716"><title>Meu espaço · Organização pessoal</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#inicio"><span class="logo">m.</span> meu espaço</a><div class="workspace">PESSOAL <span>⌄</span></div><nav id="nav"></nav><div class="sidebottom"><span>◈ &nbsp; Espaço privado</span><small>Uma coisa de cada vez.</small><div class="profile"><b>EU</b><div>Meu espaço pessoal<small>Organize no seu ritmo</small></div></div></div></aside><main><header><span id="breadcrumb">Meu espaço / Visão geral</span><span class="private">♧ &nbsp; Só você</span></header><section id="view"></section><footer>Seu espaço, seu ritmo.<span>Salvo neste navegador · <button id="export">Exportar dados ↗</button></span></footer></main><dialog id="modal"><form id="form"><div class="modalhead"><h2 id="formtitle">Novo item</h2><button type="button" id="close" aria-label="Fechar">×</button></div><label>Título<input name="title" required maxlength="120" placeholder="O que você quer organizar?"></label><label>Área<select name="type"><option value="estudos">Estudos</option><option value="treinos">Treinos</option><option value="lembretes">Lembretes</option><option value="eventos">Calendário</option></select></label><div class="fields"><label>Data<input type="date" name="date" required></label><label>Horário<input type="time" name="time"></label></div><label>Detalhes<textarea name="notes" placeholder="Matéria, séries e repetições, ou uma anotação..."></textarea></label><button class="primary" type="submit">Salvar item</button></form></dialog><script src="app.js"></script></body></html>
